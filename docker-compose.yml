services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
      - ${MUSICA_LOCAL:-./music/local}:/music/local:ro
      - ${MUSICA_GRATIS:-./music/gratis}:/music/gratis:ro
